name: Fact Reel – mapa + datos curiosos

# Fact Reels ("Did you know…", map + photos + stick man). fetch = OpenStreetMap data for the map;
# render = build reels/facts/<id>/reel.mp4 from storyboard.json (voice needs the internet, so it runs here).
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [all, fetch, photos, render]
        default: all
      id:
        required: true
        description: "Folder in reels/facts/ (e.g. amsterdam-en)"
      args:
        required: false
        default: ""
        description: "fetch only: \"City, Country\" or rel:<OSM relation id>"

permissions:
  contents: write

concurrency:
  group: factreel-${{ github.event.inputs.id }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          sudo apt-get install -y -qq libcairo2-dev pkg-config >/dev/null
          pip install --quiet pillow requests edge-tts numpy pycairo scipy
      - name: Git
        run: |
          git config user.name "viajespillados-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch map data
        if: github.event.inputs.mode == 'fetch'
        run: |
          python scripts/factmap_fetch.py "${{ github.event.inputs.id }}" "${{ github.event.inputs.args }}"
      - name: Photos
        if: github.event.inputs.mode == 'photos'
        run: python scripts/factreel.py photos "${{ github.event.inputs.id }}"
      - name: Render
        if: github.event.inputs.mode == 'render'
        run: python scripts/factreel.py render "${{ github.event.inputs.id }}"
      - name: Map + photos + render
        if: github.event.inputs.mode == 'all'
        run: python scripts/factreel.py all "${{ github.event.inputs.id }}"
      - name: Commit
        run: |
          git add -A reels
          git commit -m "Fact Reel ${{ github.event.inputs.mode }}: ${{ github.event.inputs.id }}" || exit 0
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
