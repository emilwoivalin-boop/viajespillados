name: Facebook – conectar / probar / publicar

# auth   = una vez: cambia FB_USER_TOKEN (Graph API Explorer) por un token de página sin vencimiento
# check  = probar la conexión
# latest = publicar en la página lo último que salió en Instagram (si no está ya)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, auth, latest]
        default: check

permissions:
  contents: write

concurrency:
  group: fb-post
  cancel-in-progress: false

jobs:
  fb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pillow
      - name: Facebook
        env:
          FB_APP_ID: "2012026906153717"
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: python scripts/fb_post.py "${{ github.event.inputs.mode }}"
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "viajespillados-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fb || true
          git commit -m "Facebook: ${{ github.event.inputs.mode }}" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
