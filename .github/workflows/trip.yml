name: Travel plan – render videos

# Renders trips/<id>/storyboard_es.json and storyboard_en.json into video_es.mp4 / video_en.mp4.
# The videos are NOT published anywhere and are NOT put on the website: they go to the branch
# "trip-videos" (folder <id>/).
# Where: on the owner's Mac (self-hosted runner with label "mac-render") when it is online and idle,
# otherwise on two GitHub machines (Spanish and English in parallel). The "pick" job checks this with the
# secret RUNNER_CHECK_TOKEN (fine-grained token, this repo, "Administration: read"); without it GitHub is used.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Folder in trips/ (e.g. medellin-3-dias)"
        required: true
      langs:
        description: "Languages to render (default: es en)"
        required: false
        default: "es en"
      where:
        description: "auto = Mac if online, else GitHub · github = always GitHub"
        type: choice
        options: [auto, github]
        default: auto

permissions:
  contents: write

concurrency:
  group: trip-render
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.c.outputs.mac }}
    steps:
      - id: c
        env:
          T: ${{ secrets.RUNNER_CHECK_TOKEN }}
          WHERE: ${{ github.event.inputs.where || 'auto' }}
        run: |
          mac=false
          if [ "$WHERE" = auto ] && [ -n "$T" ]; then
            n=$(curl -s -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runners" |
                jq '[.runners[]? | select(.status=="online" and .busy==false and ([.labels[].name] | index("mac-render")))] | length')
            [ "${n:-0}" -gt 0 ] && mac=true
          fi
          echo "Mac online: $mac"
          echo "mac=$mac" >> "$GITHUB_OUTPUT"

  mac:
    needs: pick
    if: needs.pick.outputs.mac == 'true'
    runs-on: [self-hosted, macOS, mac-render]
    timeout-minutes: 50
    env:
      WANTED: ${{ github.event.inputs.langs || 'es en' }}
      ID: ${{ github.event.inputs.id }}
    steps:
      - uses: actions/checkout@v5
      - name: Tools (installed once, then reused)
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          which ffmpeg || brew install ffmpeg
          V="$HOME/.viajespillados-venv"
          [ -x "$V/bin/python" ] || python3 -m venv "$V"
          "$V/bin/pip" install --quiet --upgrade pillow requests edge-tts
          echo "$V/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          git config user.name "viajespillados-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Render (languages in parallel, each in its own copy)
        run: |
          pids=""
          for L in $WANTED; do
            D="$RUNNER_TEMP/r-$L"; rm -rf "$D"; cp -R "$GITHUB_WORKSPACE" "$D"
            ( cd "$D" && LANGS="$L" python scripts/reel.py trip "$ID" > "$RUNNER_TEMP/log-$L.txt" 2>&1 ) &
            pids="$pids $!"
          done
          ok=0; for p in $pids; do wait $p || ok=1; done
          for L in $WANTED; do echo "=== $L ==="; tail -20 "$RUNNER_TEMP/log-$L.txt"
            cp "$RUNNER_TEMP/r-$L/trips/$ID/"*"$L"* "trips/$ID/" 2>/dev/null || true; done
          exit $ok
      - name: Save videos to branch trip-videos
        if: always()
        run: scripts/save_trip_videos.sh "$ID" $WANTED

  trip:
    needs: pick
    if: needs.pick.outputs.mac != 'true'
    # Spanish and English render at the same time on two GitHub machines (each saves its own files)
    strategy:
      fail-fast: false
      matrix:
        lang: [es, en]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      L: ${{ matrix.lang }}
      WANTED: ${{ github.event.inputs.langs || 'es en' }}
      ID: ${{ github.event.inputs.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install --quiet pillow requests edge-tts
      - name: Git
        run: |
          git config user.name "viajespillados-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Render
        run: |
          case " $WANTED " in *" $L "*) ;; *) echo "skip $L (not asked)"; exit 0;; esac
          LANGS="$L" python scripts/reel.py trip "$ID"
      - name: Save videos to branch trip-videos
        if: always()   # keep a finished language even if the other one failed
        run: scripts/save_trip_videos.sh "$ID" "$L"
