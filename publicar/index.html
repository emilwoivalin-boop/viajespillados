<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Posts listos · Viajes Pillados</title>
<link rel="icon" href="../logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14223b; --coral:#ff5a4e; --coral-dark:#e8463b; --yellow:#ffc631;
    --ink:#14223b; --muted:#4f5b6b; --bg:#fff8ec; --soft:#ffefc9; --line:#f0e3c8; --card:#ffffff; --ok:#1f8a4c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#fff8ec; --muted:#b8c0cc; --bg:#101b30; --soft:#1b2a45; --line:#2a3a58; --card:#16233b; --ok:#4cc27e;
    }
  }
  :root[data-theme="dark"]{
    --ink:#fff8ec; --muted:#b8c0cc; --bg:#101b30; --soft:#1b2a45; --line:#2a3a58; --card:#16233b; --ok:#4cc27e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
  header{display:flex;align-items:center;gap:10px;padding:18px 0 6px}
  header img{width:40px;height:40px}
  header .wm{font:900 20px/1 Inter,sans-serif;letter-spacing:-.02em}
  header .wm b{color:var(--coral)}
  h1{font-weight:900;font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:14px 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .how{background:var(--soft);border-radius:16px;padding:14px 16px;margin:0 0 22px;font-size:14px}
  .how ol{margin:6px 0 0;padding-left:20px}
  .how li{margin:3px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:0 0 22px;box-shadow:0 1px 2px rgba(20,34,59,.06)}
  .card.done{opacity:.55}
  .card img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;background:var(--navy)}
  .body{padding:14px 14px 16px}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .badge{font:800 12px/1 Inter,sans-serif;padding:6px 9px;border-radius:999px;background:var(--yellow);color:var(--navy)}
  .badge.rev{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
  .badge.ok{background:var(--ok);color:#fff}
  .title{font-weight:800;font-size:18px;line-height:1.25;margin:0}
  .meta{color:var(--muted);font-size:13px;margin:2px 0 10px}
  textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,sans-serif}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 12px;border-radius:12px;border:0;background:var(--coral);color:#fff;font:800 15px Inter,sans-serif;text-decoration:none;cursor:pointer;text-align:center}
  .btn:active{background:var(--coral-dark)}
  .btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.wide{grid-column:1/-1}
  .msg{font-size:13px;color:var(--ok);min-height:1.3em;margin-top:6px}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="../logo-icon.png" alt=""><span class="wm">Viajes <b>Pillados</b></span></header>
  <h1>Posts listos</h1>
  <p class="sub" id="updated">Cargando…</p>

  <div class="how">
    <strong>Cómo publicar (desde el celular):</strong>
    <ol>
      <li>Toca <b>Copiar texto</b>.</li>
      <li>Toca <b>Compartir imagen</b> y elige Instagram (o <b>Guardar imagen</b> y súbela desde la app).</li>
      <li>En Instagram agrega la <b>música</b>, pega el texto y publica.</li>
      <li>Vuelve aquí y marca <b>Ya lo publiqué</b>.</li>
    </ol>
  </div>

  <div id="list"></div>
</div>

<script>
const KEY = "vp-publicados";
function loadDone(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }catch(e){ return new Set(); } }
function saveDone(set){ try{ localStorage.setItem(KEY, JSON.stringify([...set])); }catch(e){} }
let done = loadDone();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function flash(el, text){ el.textContent = text; setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, 2500); }

async function copyText(text, msg){
  try{ await navigator.clipboard.writeText(text); flash(msg, "Texto copiado ✓"); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); flash(msg, "Texto copiado ✓"); }catch(_){ flash(msg, "Selecciona el texto y cópialo a mano"); }
    ta.remove();
  }
}

async function shareImage(p, msg){
  try{
    const r = await fetch(p.imagen, {cache:"no-store"});
    const blob = await r.blob();
    const file = new File([blob], `${p.id}.jpg`, {type:"image/jpeg"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
    } else {
      flash(msg, "Tu navegador no deja compartir; usa Guardar imagen");
    }
  }catch(e){ if (e && e.name !== "AbortError") flash(msg, "No se pudo compartir; usa Guardar imagen"); }
}

function render(data){
  const list = document.getElementById("list");
  document.getElementById("updated").textContent =
    data.posts.length ? `${data.posts.length} oferta(s) de los últimos 3 días · actualizado ${data.actualizado}` : `Actualizado ${data.actualizado}`;
  if (!data.posts.length){
    list.innerHTML = '<div class="empty">No hay posts nuevos ahora. Aparecen aquí cada mañana después de la revisión diaria.</div>';
    return;
  }
  list.innerHTML = "";
  for (const p of data.posts){
    const isDone = done.has(p.id);
    const card = document.createElement("article");
    card.className = "card" + (isDone ? " done" : "");
    card.innerHTML = `
      <img src="${esc(p.imagen)}" alt="Vuelos de ${esc(p.aerolinea)} a ${esc(p.destino)}" loading="lazy">
      <div class="body">
        <div class="top">
          ${isDone ? '<span class="badge ok">Publicado</span>' : p.recomendado ? '<span class="badge">Recomendado</span>' : '<span class="badge rev">Por revisar</span>'}
        </div>
        <p class="title">${esc(p.destino)} · ${esc(p.precio)}</p>
        <p class="meta">${esc([p.aerolinea, p.tipo, p.escalas, p.mes].filter(Boolean).join(" · "))} · <a href="${esc(p.link)}" target="_blank" rel="noopener">ver vuelo</a></p>
        <textarea readonly>${esc(p.texto)}</textarea>
        <div class="btns">
          <button class="btn" data-a="copy">Copiar texto</button>
          <button class="btn" data-a="share">Compartir imagen</button>
          <a class="btn alt" href="${esc(p.imagen)}" download="${esc(p.id)}.jpg">Guardar imagen</a>
          <button class="btn alt" data-a="done">${isDone ? "Desmarcar" : "Ya lo publiqué"}</button>
        </div>
        <div class="msg" role="status"></div>
      </div>`;
    const msg = card.querySelector(".msg");
    card.querySelector('[data-a="copy"]').onclick = () => copyText(p.texto, msg);
    card.querySelector('[data-a="share"]').onclick = () => shareImage(p, msg);
    card.querySelector('[data-a="done"]').onclick = () => {
      if (done.has(p.id)) done.delete(p.id); else done.add(p.id);
      saveDone(done); render(data);
    };
    list.appendChild(card);
  }
}

fetch(`../instagram/ready/posts.json?_=${Date.now()}`, {cache:"no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => {
    document.getElementById("updated").textContent = "";
    document.getElementById("list").innerHTML = '<div class="empty">Todavía no hay posts preparados.</div>';
  });
</script>
</body>
</html>
