<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectar TikTok</title><link rel="icon" href="../logo-icon.png"><style>
:root{--navy:#14223b;--coral:#ff5a4e;--yellow:#ffc631;--bg:#fff8ec;--muted:#4f5b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}a{color:var(--coral)}h1{font-size:30px;line-height:1.2}h2{font-size:20px;margin-top:28px}
header a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:800}header img{width:36px;height:36px}
.box{background:#fff;border:1px solid #f0e3c8;border-radius:14px;padding:18px;margin:18px 0}code{font-size:18px;word-break:break-all;background:#ffefc9;padding:6px 8px;border-radius:8px;display:block}
button{background:var(--coral);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}small{color:var(--muted)}
</style></head><body><main><header><a href="../"><img src="../logo-icon.png" alt="">viajespillados</a></header>
<h1>Conectar TikTok</h1>
<div class="box" id="ok" hidden><p><b>¡Listo! Copia este código</b> y pégalo en GitHub → Actions → <b>TikTok – conectar</b> → Run workflow (campo <i>code</i>). Caduca en unos minutos.</p>
<code id="code"></code><button id="copy">Copiar código</button></div>
<div class="box" id="err" hidden><p><b>TikTok no devolvió un código.</b></p><p id="msg"></p></div>
<p><small>Esta página solo muestra el código de autorización de TikTok; no lo guarda ni lo envía a ningún sitio.</small></p>
<script>
const p=new URLSearchParams(location.search), code=p.get("code");
if(code){document.getElementById("ok").hidden=false;document.getElementById("code").textContent=code;
 document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(code).then(()=>document.getElementById("copy").textContent="Copiado ✓");}
else{document.getElementById("err").hidden=false;document.getElementById("msg").textContent=(p.get("error")||"")+" "+(p.get("error_description")||"");}
</script></main></body></html>
